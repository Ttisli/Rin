name: SEO Workflow

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Rin repository
        uses: actions/checkout@v4
        with:
          path: Rin

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 21

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies and trust Puppeteer postinstall
        run: |
          cd Rin/
          # 信任 postinstall 脚本，允许 Puppeteer 下载浏览器
          bun install --frozen-lockfile --trust-pm
          
      - name: Install and verify Chrome browser for Puppeteer
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer
        run: |
          cd Rin/
          # 强制安装 Chrome 浏览器
          npx puppeteer browsers install chrome
          # 验证浏览器安装
          echo "=== Puppeteer 浏览器列表 ==="
          npx puppeteer browsers list
          echo "=== 缓存目录内容 ==="
          ls -la /home/runner/.cache/puppeteer/ || echo "缓存目录不存在"
          echo "=== Chrome 可执行文件检查 ==="
          find /home/runner/.cache/puppeteer -name "chrome" -type f 2>/dev/null || echo "未找到 Chrome 可执行文件"

      - name: Run script
        env: # Or as an environment variable
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SEO_BASE_URL: ${{ vars.SEO_BASE_URL }}
          SEO_CONTAINS_KEY: ${{ vars.SEO_CONTAINS_KEY }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer
        run: |
          cd Rin/
          # 运行前再次验证浏览器
          echo "=== 运行前浏览器检查 ==="
          npx puppeteer browsers list
          echo "=== 开始运行 SEO 脚本 ==="
          bun scripts/render.ts
